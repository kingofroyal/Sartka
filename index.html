<!DOCTYPE html>  <html lang="ku" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1.0">  
<title>سیستەمی نۆرە و حجز</title>  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<style>  
*{box-sizing:border-box;margin:0;padding:0}  
body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff 0%,#f8fbff 45%,#eefbf6 100%);color:#172033;line-height:1.8;min-height:100vh}  
header{background:linear-gradient(135deg,#075fc4,#0879e8 55%,#00a878);color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 4px 15px #0002}  
.logo{font-size:22px;font-weight:bold}.langs{display:flex;gap:5px}  
.langs button{border:1px solid #ffffff55;background:#ffffff18;color:white;padding:6px 10px;border-radius:7px;cursor:pointer}  
.hero{max-width:1100px;margin:25px auto;padding:30px 20px;display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:center}  
.hero h1{font-size:38px;line-height:1.35;color:#075ebd;margin-bottom:10px}.hero p{color:#5e6b7d;font-size:17px}  
.profile{width:260px;height:260px;object-fit:cover;border-radius:50%;margin:auto;display:block;border:8px solid white;box-shadow:0 8px 30px #0002}  
.container{max-width:1100px;margin:auto;padding:0 15px 40px}.tabs{display:flex;gap:10px;margin-bottom:20px}  
.tab{flex:1;border:0;padding:14px;border-radius:10px;background:#dce9f8;color:#075ebd;cursor:pointer;font-weight:bold;font-size:16px}.tab.active{background:#0879e8;color:white}  
.card{background:#ffffffee;backdrop-filter:blur(8px);position:relative;overflow:hidden;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 12px 35px #1c4d7a12;border:1px solid #ffffff}.card h2{color:#075ebd;margin-bottom:18px}  
.form-group{margin-bottom:15px}label{display:block;font-weight:bold;margin-bottom:6px}  
input,select{width:100%;padding:13px;border:1px solid #ccd6e3;border-radius:9px;font-size:16px;outline:none;background:white}  
input:focus,select:focus{border-color:#0879e8;box-shadow:0 0 0 3px #0879e818}  
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.day{border:1px solid #cbd8e7;background:white;color:#075ebd;border-radius:12px;padding:12px 5px;cursor:pointer;text-align:center;transition:.2s}.day:hover{transform:translateY(-2px);box-shadow:0 7px 18px #0879e81a}.day.active{background:#0879e8;color:white}.day small{display:block;font-size:12px;margin-top:4px;opacity:.9}.day.past{opacity:.45;cursor:not-allowed}.notify-btn{margin-top:10px;width:100%;background:#eef7ff;color:#075ebd;border:1px solid #b9d9f7;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.notify-btn.ok{background:#eaf9ef;color:#168044;border-color:#bfe6cb}.time.past{opacity:.45;cursor:not-allowed}  
.times{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.time{border:1px solid #cbd8e7;background:white;color:#075ebd;border-radius:10px;padding:10px;cursor:pointer;transition:.2s}.time:hover{transform:translateY(-1px)}.time.active{background:#0879e8;color:white}  
.time.booked{background:#e9edf2;color:#9aa5b2;cursor:not-allowed;text-decoration:line-through}  
.primary{width:100%;border:0;background:linear-gradient(135deg,#0879e8,#075fc4);color:white;padding:14px;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}.primary:hover{background:#005fca}.primary:disabled{opacity:.6;cursor:not-allowed}  
.message{padding:14px;border-radius:10px;margin:15px 0;display:none}.success{background:#dff7e8;color:#126b36;display:block}.error{background:#ffe2e2;color:#9b1717;display:block}  
.loading{text-align:center;padding:15px;color:#65758b}.booking-list{display:flex;flex-direction:column;gap:10px}  
.booking{border:1px solid #e0e6ee;border-radius:10px;padding:13px;background:#fafcff;display:flex;justify-content:space-between;align-items:center}.badge{background:#0879e8;color:white;border-radius:8px;padding:4px 9px;font-weight:bold}  
.owner-login{max-width:500px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}  
.stat{background:#f3f8ff;border:1px solid #dbe9f8;border-radius:12px;padding:18px;text-align:center}.stat strong{display:block;font-size:28px;color:#0879e8}  
.owner-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.owner-tools button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold}  
.danger{background:#e53935;color:white}.warning{background:#ffb300;color:white}.table-wrap{overflow-x:auto}  
table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid #e5e9ef;text-align:right}th{background:#f1f6fb;color:#075ebd}  
.renew-btn{border:0;background:#14a66a;color:#fff;padding:11px 15px;border-radius:10px;font-weight:bold;cursor:pointer}.renew-btn:hover{background:#108b58}.delete-btn{border:0;background:#e53935;color:white;border-radius:7px;padding:7px 12px;cursor:pointer}.hidden{display:none!important}  
.confirm{text-align:center;border:2px solid #21a957;background:#f0fff5}.confirm-number{font-size:48px;color:#0879e8;font-weight:bold;margin:10px 0}  
footer{text-align:center;padding:25px;background:#10243d;color:white;margin-top:30px}  
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.hero h1{font-size:30px}.days{grid-template-columns:repeat(4,1fr)}.times{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr}}  
@media(max-width:500px){header{flex-direction:column}.days{grid-template-columns:repeat(2,1fr)}.times{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.profile{width:210px;height:210px}}  
</style>  
</head>

<header>  
<div class="logo">📅 Queue System</div>  
<div class="langs">  
<button onclick="changeLanguage('ku')">کوردی</button>

<button onclick="changeLanguage('en')">English</button>  
</div>

</div>
